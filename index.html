<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1c">
<meta name="description" content="猜数字小游戏 · 三档难度、范围收窄提示、全站排行榜。天逸出品。">
<title>猜数字 · 天逸</title>
<style>
  /* ==================================================================
     猜数字 · 网页版
     零依赖、纯 CSS 视觉（不用 canvas —— 部分国产内核上 canvas 不可靠）。
     所有动效只动 transform / opacity，避免重绘导致的闪烁。
     ================================================================== */

  :root {
    --bg-0: #070b1c;
    --line: rgba(150, 185, 255, .16);
    --line-strong: rgba(150, 185, 255, .3);
    --text: #e8eeff;
    --text-soft: #a9b6d6;
    --text-dim: #7d8aad;
    --gold: #f2d79b;
    --ice: #c7e2ff;
    --green: #7ee2a8;
    --red: #ff9a9a;
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px 40px;
    background: var(--bg-0);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 星空：radial-gradient 平铺，纯静态，永不闪烁 */
  .sky {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-color: var(--bg-0);
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.8) 40%, transparent 100%),
      radial-gradient(1px 1px at 34% 7%, rgba(205,232,255,.6) 40%, transparent 100%),
      radial-gradient(1.8px 1.8px at 68% 22%, rgba(255,232,168,.7) 40%, transparent 100%),
      radial-gradient(1.1px 1.1px at 87% 41%, rgba(255,255,255,.55) 40%, transparent 100%),
      radial-gradient(1.3px 1.3px at 22% 63%, rgba(205,232,255,.65) 40%, transparent 100%),
      radial-gradient(1px 1px at 55% 78%, rgba(255,255,255,.5) 40%, transparent 100%),
      radial-gradient(1.6px 1.6px at 78% 88%, rgba(255,232,168,.55) 40%, transparent 100%),
      radial-gradient(1.2px 1.2px at 8% 92%, rgba(255,255,255,.45) 40%, transparent 100%),
      radial-gradient(1px 1px at 44% 34%, rgba(205,232,255,.4) 40%, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 12%, rgba(255,255,255,.5) 40%, transparent 100%);
    background-repeat: repeat;
    background-size: 520px 520px;
  }
  .sky::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 50% 28%,
      rgba(38, 62, 130, .5) 0%, rgba(10, 17, 42, .82) 55%, var(--bg-0) 100%);
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 580px; }

  header { text-align: center; margin-bottom: 20px; }
  .kicker {
    margin: 0 0 8px; font-size: .72rem; letter-spacing: .22em;
    text-transform: uppercase; color: var(--gold); opacity: .85;
  }
  h1 {
    margin: 0; font-size: clamp(1.7rem, 7vw, 2.4rem); font-weight: 800; letter-spacing: .04em;
    background: linear-gradient(100deg, #fff 10%, var(--ice) 45%, var(--gold) 88%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 10px 0 0; font-size: .88rem; color: var(--text-soft); }

  /* ---------------- 难度选择 ---------------- */
  .diffs { display: flex; gap: 8px; margin-bottom: 16px; }

  .diff {
    flex: 1; padding: 10px 6px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(10, 17, 42, .6);
    color: var(--text-soft); font: inherit; font-size: .82rem; font-weight: 600;
    cursor: pointer; transition: transform .16s, border-color .2s, color .2s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .diff b { display: block; font-size: .72rem; font-weight: 400; opacity: .7; margin-top: 2px; }
  .diff:hover { border-color: var(--line-strong); }
  .diff:active { transform: scale(.97); }
  .diff.is-active {
    border-color: rgba(242, 215, 155, .6);
    background: rgba(242, 215, 155, .14);
    color: var(--gold);
  }
  .diff.is-active b { opacity: .85; }

  /* ---------------- 主面板 ---------------- */
  .panel {
    padding: 20px 18px 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(160deg, rgba(22, 33, 70, .92), rgba(12, 19, 44, .92));
    box-shadow: 0 30px 70px -34px rgba(0, 0, 0, .95);
  }

  .status { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat {
    flex: 1; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: rgba(10, 17, 42, .6); text-align: center;
  }
  .stat b {
    display: block; font-size: 1.2rem; font-weight: 800; color: var(--ice);
    font-variant-numeric: tabular-nums;
  }
  .stat span {
    display: block; margin-top: 2px; font-size: .7rem;
    letter-spacing: .08em; color: var(--text-dim);
  }

  .range {
    margin-bottom: 14px; padding: 10px 14px; border-radius: 11px;
    border: 1px dashed var(--line-strong); background: rgba(10, 17, 42, .5);
    font-size: .84rem; color: var(--text-soft); text-align: center;
  }
  .range b { color: var(--gold); font-variant-numeric: tabular-nums; }

  .input-row { display: flex; gap: 10px; }

  input[type="text"] {
    flex: 1; min-width: 0; padding: 14px 16px;
    border: 1px solid var(--line-strong); border-radius: 12px;
    background: rgba(7, 11, 28, .85); color: var(--text);
    font-size: 1.12rem; font-weight: 700; letter-spacing: .06em;
    font-variant-numeric: tabular-nums; outline: none;
    transition: border-color .18s, box-shadow .18s;
    -webkit-appearance: none; appearance: none;
  }
  input[type="text"]::placeholder { color: var(--text-dim); font-weight: 400; letter-spacing: 0; }
  input[type="text"]:focus {
    border-color: rgba(242, 215, 155, .6);
    box-shadow: 0 0 0 3px rgba(242, 215, 155, .13);
  }

  button {
    border: 0; border-radius: 12px; padding: 14px 22px;
    font: inherit; font-weight: 800; letter-spacing: .04em; color: #0a1024;
    background: linear-gradient(120deg, var(--gold), #ffe9b8);
    cursor: pointer; transition: transform .16s, filter .16s;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: scale(.965); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }
  button:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }

  .btn-ghost {
    color: var(--text-soft); background: transparent;
    border: 1px solid var(--line-strong);
  }
  .btn-ghost:hover { background: rgba(120, 160, 255, .1); filter: none; }

  .feedback {
    margin-top: 14px; min-height: 52px; padding: 13px 16px;
    border-radius: 12px; border: 1px solid var(--line);
    background: rgba(10, 17, 42, .55);
    font-size: .95rem; text-align: center;
    transition: border-color .2s, background .2s;
  }
  .feedback.up { border-color: rgba(255, 154, 154, .48); background: rgba(255, 120, 120, .09); color: var(--red); }
  .feedback.down { border-color: rgba(160, 200, 255, .48); background: rgba(120, 170, 255, .09); color: var(--ice); }
  .feedback.win { border-color: rgba(126, 226, 168, .55); background: rgba(80, 220, 150, .1); color: var(--green); }
  .feedback.warn { border-color: rgba(242, 215, 155, .45); background: rgba(242, 215, 155, .09); color: var(--gold); }
  .feedback strong { font-size: 1.05rem; }

  .history { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(10, 17, 42, .65);
    font-size: .8rem; font-variant-numeric: tabular-nums; color: var(--text-soft);
    animation: chip-in .26s cubic-bezier(.2, .8, .3, 1) both;
  }
  .chip.hi { border-color: rgba(255, 154, 154, .4); color: var(--red); }
  .chip.lo { border-color: rgba(160, 200, 255, .4); color: var(--ice); }
  .chip.ok { border-color: rgba(126, 226, 168, .55); color: var(--green); font-weight: 700; }

  @keyframes chip-in {
    from { opacity: 0; transform: translateY(6px) scale(.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .panel.won {
    border-color: rgba(126, 226, 168, .5);
    animation: win-pop .5s cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes win-pop {
    0% { transform: scale(1); } 55% { transform: scale(1.012); } 100% { transform: scale(1); }
  }

  .actions { margin-top: 16px; display: flex; gap: 10px; }
  .actions button { flex: 1; padding: 12px 16px; font-size: .9rem; }

  /* ---------------- 上榜 ---------------- */
  .submit-row {
    margin-top: 14px; display: none;
    gap: 9px; padding: 13px;
    border: 1px solid rgba(242, 215, 155, .35);
    border-radius: 12px; background: rgba(242, 215, 155, .07);
  }
  .submit-row.is-open { display: flex; }
  .submit-row input {
    flex: 1; min-width: 0; padding: 10px 13px; font-size: .92rem;
  }
  .submit-row button { padding: 10px 16px; font-size: .88rem; }

  /* ---------------- 排行榜 ---------------- */
  .board { margin-top: 18px; }
  .board-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .board-head h2 {
    margin: 0; font-size: .84rem; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim);
  }
  .board-tip { font-size: .72rem; color: var(--text-dim); }

  .board-list { list-style: none; margin: 0; padding: 0; }

  .board-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 10px;
    background: rgba(10, 17, 42, .55);
    font-size: .86rem;
    animation: chip-in .3s cubic-bezier(.2, .8, .3, 1) both;
  }
  .board-item .rank {
    width: 22px; text-align: center; font-weight: 800;
    color: var(--text-dim); font-variant-numeric: tabular-nums;
  }
  .board-item.top1 { border-color: rgba(242, 215, 155, .5); background: rgba(242, 215, 155, .09); }
  .board-item.top1 .rank { color: var(--gold); }
  .board-item.top2 { border-color: rgba(200, 220, 255, .4); }
  .board-item.top2 .rank { color: var(--ice); }
  .board-item.top3 { border-color: rgba(205, 170, 130, .4); }
  .board-item.top3 .rank { color: #d8b98d; }
  .board-item .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-item .score { color: var(--green); font-weight: 700; font-variant-numeric: tabular-nums; }
  .board-empty {
    padding: 16px; text-align: center; font-size: .84rem;
    color: var(--text-dim); border: 1px dashed var(--line); border-radius: 10px;
  }

  footer {
    margin-top: 18px; text-align: center;
    font-size: .76rem; color: var(--text-dim);
  }
  footer a { color: var(--text-soft); text-decoration: none; border-bottom: 1px dotted var(--line-strong); }
  footer a:hover { color: var(--gold); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (max-width: 420px) {
    .panel { padding: 17px 14px 15px; }
    input[type="text"] { padding: 13px 14px; font-size: 1.02rem; }
    button { padding: 13px 16px; }
    .stat b { font-size: 1.06rem; }
    .diff { font-size: .76rem; padding: 9px 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <p class="kicker">Guess the Number</p>
    <h1>猜数字</h1>
    <p class="sub">我心里想了一个整数，你猜，我只告诉你大了还是小了。</p>
  </header>

  <!-- 难度 -->
  <div class="diffs" role="group" aria-label="选择难度">
    <button class="diff" type="button" data-diff="easy">简单<b>1 ~ 50</b></button>
    <button class="diff is-active" type="button" data-diff="normal">普通<b>1 ~ 100</b></button>
    <button class="diff" type="button" data-diff="hard">困难<b>1 ~ 500</b></button>
  </div>

  <main class="panel" id="panel">
    <div class="status">
      <div class="stat"><b id="tries">0</b><span>已猜次数</span></div>
      <div class="stat"><b id="best">—</b><span>本档最佳</span></div>
    </div>

    <p class="range" id="range">范围：<b>1</b> ~ <b>100</b></p>

    <div class="input-row">
      <label for="guess" class="sr-only">输入你猜的数字</label>
      <input id="guess" type="text" inputmode="numeric" autocomplete="off"
             placeholder="输入 1~100" maxlength="3" enterkeyhint="go" autofocus>
      <button id="submitBtn" type="button">猜</button>
    </div>

    <p class="feedback" id="feedback" role="status" aria-live="polite">准备好了就开始吧 ✦</p>

    <div class="history" id="history" aria-label="猜测记录"></div>

    <!-- 上榜（猜中后出现） -->
    <div class="submit-row" id="submitRow">
      <label for="nick" class="sr-only">你的昵称</label>
      <input id="nick" type="text" placeholder="留个名字上榜" maxlength="12" autocomplete="off">
      <button id="rankBtn" type="button">上榜</button>
    </div>

    <div class="actions">
      <button id="restartBtn" class="btn-ghost" type="button">重新开始</button>
    </div>
  </main>

  <!-- 排行榜 -->
  <section class="board">
    <div class="board-head">
      <h2>排行榜 · <span id="boardDiff">普通</span></h2>
      <span class="board-tip" id="boardTip">读取中…</span>
    </div>
    <ul class="board-list" id="boardList" aria-live="polite"></ul>
  </section>

  <footer>
    <a href="https://github.com/hagxybu123/guess-number-game" target="_blank" rel="noopener">查看源码</a>
    &nbsp;·&nbsp;
    <a href="https://hagxybu123.github.io/" target="_blank" rel="noopener">天逸 · 星庭</a>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- 配置 ---------------- */
  var DIFFS = {
    easy:   { name: '简单', min: 1, max: 50,  best: 6 },
    normal: { name: '普通', min: 1, max: 100, best: 7 },
    hard:   { name: '困难', min: 1, max: 500, best: 9 }
  };

  var BEST_KEY = 'tianyi-guess-best';
  var LOCAL_BOARD_KEY = 'tianyi-guess-board';
  /* 排行榜后端：textdb.online（与主页留言板同一服务，无需注册、CORS 可用） */
  var BOARD_KEY = 'tianyi-guess-board-7k2m9q';
  var BOARD_URL = 'https://textdb.online/' + BOARD_KEY;
  var BOARD_POST = 'https://textdb.online/update';
  var BOARD_MAX = 60;      // 最多保存多少条
  var SHOW_MAX = 8;        // 每档显示多少条

  var $ = function (id) { return document.getElementById(id); };

  var panel = $('panel');
  var input = $('guess');
  var submitBtn = $('submitBtn');
  var restartBtn = $('restartBtn');
  var feedback = $('feedback');
  var history = $('history');
  var triesEl = $('tries');
  var bestEl = $('best');
  var rangeEl = $('range');
  var submitRow = $('submitRow');
  var nickInput = $('nick');
  var rankBtn = $('rankBtn');
  var boardList = $('boardList');
  var boardTip = $('boardTip');
  var boardDiff = $('boardDiff');
  var diffBtns = Array.prototype.slice.call(document.querySelectorAll('.diff'));

  var diff = 'normal';
  var cfg = DIFFS[diff];
  var answer, tries, lo, hi, over, wonAt, submitted;

  /* ---------------- 本地存储 ---------------- */
  function readBestAll() {
    try {
      var raw = localStorage.getItem(BEST_KEY);
      if (!raw) return {};
      var o = JSON.parse(raw);
      return (o && typeof o === 'object') ? o : {};
    } catch (e) { return {}; }
  }

  function readBest(d) {
    var v = readBestAll()[d];
    return (typeof v === 'number' && v >= 1) ? v : null;
  }

  function writeBest(d, n) {
    try {
      var o = readBestAll();
      var cur = (typeof o[d] === 'number') ? o[d] : Infinity;
      if (n < cur) { o[d] = n; localStorage.setItem(BEST_KEY, JSON.stringify(o)); return true; }
      return false;
    } catch (e) { return false; }
  }

  function renderBest() {
    var b = readBest(diff);
    bestEl.textContent = b === null ? '—' : (b + ' 次');
  }

  /* 本地榜单兜底：后端不可用时仍能看到自己玩过的成绩 */
  function readLocalBoard() {
    try {
      var raw = localStorage.getItem(LOCAL_BOARD_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function writeLocalBoard(arr) {
    try { localStorage.setItem(LOCAL_BOARD_KEY, JSON.stringify(arr.slice(0, BOARD_MAX))); } catch (e) {}
  }

  function pushLocalBoard(entry) {
    var arr = readLocalBoard();
    arr.push(entry);
    arr.sort(function (a, b) { return a.tries - b.tries; });
    writeLocalBoard(arr);
  }

  /* ---------------- 网络请求（带超时与重试） ---------------- */
  function req(url, opts, budget) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = null;
    if (ctrl) timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, budget || 4000);
    var o = Object.assign({}, opts || {});
    if (ctrl) o.signal = ctrl.signal;
    return fetch(url, o).then(function (r) {
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).catch(function (e) {
      if (timer) clearTimeout(timer);
      throw e;
    });
  }

  function loadBoard() {
    return req(BOARD_URL + '?t=' + Date.now(), { cache: 'no-store' }, 4000).then(function (txt) {
      var raw = (txt || '').trim();
      if (!raw) return [];
      var arr = JSON.parse(raw);
      if (typeof arr === 'string') arr = JSON.parse(arr);
      return Array.isArray(arr) ? arr : [];
    }).catch(function () {
      // 网络不通就用本地记录，不打扰用户
      return readLocalBoard();
    });
  }

  function saveBoard(arr) {
    var body = new URLSearchParams();
    body.set('key', BOARD_KEY);
    body.set('value', JSON.stringify(arr.slice(0, BOARD_MAX)));
    return req(BOARD_POST, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    }, 6000);
  }

  /* ---------------- 渲染榜单 ---------------- */
  function renderBoard(list, offline) {
    boardDiff.textContent = cfg.name;
    boardTip.textContent = offline ? '本地记录（云端暂时连不上）' : '';

    var mine = (list || []).filter(function (x) { return x && x.diff === diff && typeof x.tries === 'number'; });
    mine.sort(function (a, b) { return a.tries - b.tries; });
    mine = mine.slice(0, SHOW_MAX);

    boardList.innerHTML = '';
    if (!mine.length) {
      var li0 = document.createElement('li');
      li0.className = 'board-empty';
      li0.textContent = '这个难度还没有人上榜，来当第一个 ✦';
      boardList.appendChild(li0);
      return;
    }

    mine.forEach(function (x, i) {
      var li = document.createElement('li');
      li.className = 'board-item' + (i === 0 ? ' top1' : i === 1 ? ' top2' : i === 2 ? ' top3' : '');

      var rk = document.createElement('span');
      rk.className = 'rank';
      rk.textContent = String(i + 1);

      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = String(x.name || '匿名').slice(0, 12);

      var sc = document.createElement('span');
      sc.className = 'score';
      sc.textContent = x.tries + ' 次';

      li.appendChild(rk);
      li.appendChild(who);
      li.appendChild(sc);
      boardList.appendChild(li);
    });
  }

  function refreshBoard() {
    loadBoard().then(function (list) {
      var offline = !list || !list.length;
      renderBoard(list, offline && readLocalBoard().length > 0);
      return list;
    }).catch(function () {
      renderBoard(readLocalBoard(), true);
    });
  }

  /* ---------------- 一局 ---------------- */
  function reset(keepDiff) {
    cfg = DIFFS[diff];
    answer = cfg.min + Math.floor(Math.random() * (cfg.max - cfg.min + 1));
    tries = 0;
    lo = cfg.min;
    hi = cfg.max;
    over = false;
    wonAt = null;
    submitted = false;

    triesEl.textContent = '0';
    history.innerHTML = '';
    panel.classList.remove('won');
    submitRow.classList.remove('is-open');
    nickInput.value = '';
    rankBtn.disabled = false;
    rankBtn.textContent = '上榜';

    feedback.className = 'feedback';
    feedback.textContent = '准备好了就开始吧 ✦';
    rangeEl.innerHTML = '范围：<b>' + cfg.min + '</b> ~ <b>' + cfg.max + '</b>';

    submitBtn.disabled = false;
    input.disabled = false;
    input.maxLength = String(cfg.max).length;
    input.placeholder = '输入 ' + cfg.min + '~' + cfg.max;
    input.value = '';

    renderBest();
    refreshBoard();
    try { input.focus(); } catch (e) {}
  }

  function setRange() {
    rangeEl.innerHTML = '范围：<b>' + lo + '</b> ~ <b>' + hi + '</b>' +
      '　（还剩 <b>' + (hi - lo + 1) + '</b> 个可能）';
  }

  function say(text, kind) {
    feedback.className = 'feedback' + (kind ? ' ' + kind : '');
    feedback.innerHTML = text;
  }

  function addChip(n, kind) {
    var el = document.createElement('span');
    el.className = 'chip' + (kind ? ' ' + kind : '');
    el.textContent = n + (kind === 'hi' ? ' ↑' : kind === 'lo' ? ' ↓' : ' ✓');
    history.appendChild(el);
  }

  function win() {
    over = true;
    submitBtn.disabled = true;
    input.disabled = true;
    panel.classList.add('won');
    submitRow.classList.add('is-open');

    var isNew = writeBest(diff, tries);
    renderBest();

    var praise = tries === 1 ? '一次就中，你是不是偷看了我的脑子？' :
                 tries <= cfg.best ? '漂亮，这个次数已经算高手了。' :
                 tries <= cfg.best * 2 ? '还行吧，稳扎稳打。' :
                 '终于猜到了……我差点以为你要猜到明天。';

    say('<strong>猜中了！</strong> 答案是 <strong>' + answer + '</strong>，' +
      '你用了 <strong>' + tries + '</strong> 次（' + cfg.name + '）。' +
      (isNew ? '<br><span style="color:var(--gold)">✦ 本档新纪录 ✦</span>' : '') +
      '<br><span style="opacity:.8">' + praise + '</span>' +
      '<br><span style="opacity:.7;font-size:.86em">想上榜就留个名字 ↓</span>', 'win');

    try { nickInput.focus(); } catch (e) {}
  }

  /* ---------------- 猜一次 ---------------- */
  function submit() {
    if (over) return;

    var raw = input.value.trim();
    // 全角数字转半角，避免手机输入法直接打不进来
    raw = raw.replace(/[０-９]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    });

    if (!raw) { say('先输入一个数字 ✦', 'warn'); return; }
    if (!/^\d+$/.test(raw)) { say('只能输入整数哦，别来虚的 ✦', 'warn'); try { input.select(); } catch (e) {} return; }

    var n = parseInt(raw, 10);
    if (n < cfg.min || n > cfg.max) {
      say('超出范围了，只能猜 ' + cfg.min + '~' + cfg.max + ' ✦', 'warn');
      try { input.select(); } catch (e) {}
      return;
    }
    if (n < lo || n > hi) {
      say('这个数已经被排除掉了（现在只剩 ' + lo + '~' + hi + '）✦', 'warn');
      try { input.select(); } catch (e) {}
      return;
    }

    tries++;
    triesEl.textContent = String(tries);
    input.value = '';

    if (n === answer) { addChip(n, 'ok'); win(); return; }

    if (n > answer) {
      addChip(n, 'hi');
      if (n - 1 < hi) hi = n - 1;
      setRange();
      var gap = n - answer;
      say('<strong>大了</strong>' +
        (gap <= 3 ? '　—— 非常接近了' : gap <= 10 ? '　—— 有点接近' : ''), 'up');
    } else {
      addChip(n, 'lo');
      if (n + 1 > lo) lo = n + 1;
      setRange();
      var gap2 = answer - n;
      say('<strong>小了</strong>' +
        (gap2 <= 3 ? '　—— 非常接近了' : gap2 <= 10 ? '　—— 有点接近' : ''), 'down');
    }

    if (lo === hi) {
      say(feedback.innerHTML + '<br><span style="opacity:.8">只剩 ' + lo + ' 了，猜它。</span>',
        n > answer ? 'up' : 'down');
    }

    try { input.focus(); } catch (e) {}
  }

  /* ---------------- 上榜 ---------------- */
  function submitRank() {
    if (!over || submitted) return;

    var name = (nickInput.value || '').trim().slice(0, 12) || '匿名';
    var entry = { name: name, diff: diff, tries: tries, at: Date.now() };

    submitted = true;
    rankBtn.disabled = true;
    rankBtn.textContent = '上传中…';

    // 立刻写本地，保证「我玩过」这件事不会因为网络问题丢失
    pushLocalBoard(entry);

    loadBoard().then(function (list) {
      var arr = (list || []).slice();
      arr.push(entry);
      arr.sort(function (a, b) { return a.tries - b.tries; });
      arr = arr.slice(0, BOARD_MAX);
      return saveBoard(arr).then(function () {
        renderBoard(arr, false);
        rankBtn.textContent = '已上榜';
        say(feedback.innerHTML.replace(/想上榜就留个名字 ↓.*$/, '') +
          '<br><span style="color:var(--gold)">✦ 已上榜，刷新页面也能看到 ✦</span>', 'win');
      });
    }).catch(function () {
      // 云端失败：本地榜已写入，明确告知用户
      renderBoard(readLocalBoard(), true);
      rankBtn.textContent = '仅本地';
      say(feedback.innerHTML.replace(/想上榜就留个名字 ↓.*$/, '') +
        '<br><span style="opacity:.8">云端暂时连不上，这条只记在了本机</span>', 'warn');
    });
  }

  /* ---------------- 事件 ---------------- */
  submitBtn.addEventListener('click', submit);
  restartBtn.addEventListener('click', function () { reset(true); });
  rankBtn.addEventListener('click', submitRank);

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  });

  nickInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitRank(); }
  });

  input.addEventListener('input', function () {
    var v = input.value.replace(/[０-９]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    }).replace(/\D/g, '').slice(0, 4);
    if (v !== input.value) input.value = v;
  });

  diffBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var d = btn.getAttribute('data-diff');
      if (!DIFFS[d] || d === diff) return;
      diff = d;
      diffBtns.forEach(function (b) { b.classList.toggle('is-active', b === btn); });
      reset(true);
    });
  });

  reset(true);
})();
</script>
</body>
</html>
